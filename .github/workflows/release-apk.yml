name: Release APK
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify hosted Android API 35
        run: |
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
      - name: Install Gradle 8.7
        run: |
          curl -fsSL --retry 3 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> "$GITHUB_PATH"
      - name: Require signing secrets
        env:
          KS_B64: ${{ secrets.GHOSTIT_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.GHOSTIT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GHOSTIT_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.GHOSTIT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$KS_B64" ] || { echo "Missing GHOSTIT_KEYSTORE_B64" >&2; exit 1; }
          [ -n "$KS_PASS" ] || { echo "Missing GHOSTIT_KEYSTORE_PASSWORD" >&2; exit 1; }
          [ -n "$KEY_ALIAS" ] || { echo "Missing GHOSTIT_KEY_ALIAS" >&2; exit 1; }
          [ -n "$KEY_PASS" ] || { echo "Missing GHOSTIT_KEY_PASSWORD" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/signing"
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"
      - name: Build release
        env:
          GHOSTIT_KEYSTORE_PATH: ${{ runner.temp }}/signing/release.jks
          GHOSTIT_KEYSTORE_PASSWORD: ${{ secrets.GHOSTIT_KEYSTORE_PASSWORD }}
          GHOSTIT_KEY_ALIAS: ${{ secrets.GHOSTIT_KEY_ALIAS }}
          GHOSTIT_KEY_PASSWORD: ${{ secrets.GHOSTIT_KEY_PASSWORD }}
        run: gradle :app:testDebugUnitTest :app:assembleRelease --stacktrace
      - name: Package signed release
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/GhostIT-1.10.0-release.apk
          (cd dist && sha256sum GhostIT-1.10.0-release.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ghostit-1.10-signed-release
          path: dist/
      - name: Publish tag release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "GhostIT $tag" --generate-notes
          gh release upload "$tag" dist/GhostIT-1.10.0-release.apk dist/SHA256SUMS.txt --clobber
