name: Android CI
on: [pull_request]

concurrency:
  group: android-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Read-only PR validation: never push generated binaries back to a PR branch.
permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check out exact PR source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Android SDK and install native toolchain
        run: |
          set -euo pipefail
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" "cmake;3.22.1" "ndk;27.2.12479018" >/dev/null || true

      - name: Install Gradle 8.7
        run: |
          curl -fsSL --retry 3 -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Verify build provenance input
        run: test "$(git rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Prepare pinned IREE compiler + Android runtime source
        run: |
          python -m pip install --disable-pip-version-check iree-base-compiler==3.11.0
          ./tools/prepare_iree_runtime.sh
          ./tools/compile_iree_model.sh
          test -s app/src/main/assets/iree/simple_abs_vmvx.vmfb

      - name: Unit tests and experimental APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Verify bundled native libraries and Godot project
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -q 'libghostit_compute.so'
          unzip -l "$APK" | grep -q 'libghostit_iree.so'
          unzip -l "$APK" | grep -q 'assets/project.godot'
          unzip -l "$APK" | grep -q 'assets/iree/simple_abs_vmvx.vmfb'

      - name: Package APK + checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/GhostIT-1.12.0-debug.apk
          (cd dist && sha256sum GhostIT-1.12.0-debug.apk > SHA256SUMS.txt)
          (cd dist && zip -q GhostIT-1.12.0-debug.apk.zip GhostIT-1.12.0-debug.apk SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Upload compiled APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ghostit-1.12-experimental-apk
          path: dist/
