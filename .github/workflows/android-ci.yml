name: Android CI
on: [pull_request]
permissions: { contents: read }
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - run: mkdir -p dist && cp app/build/outputs/apk/debug/app-debug.apk dist/GhostIT-1.10.0-debug.apk && sha256sum dist/*.apk | tee dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ghostit-1.10-debug-apk
          path: dist/
